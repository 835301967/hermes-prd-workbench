name: Source release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'
      - name: Install locked tooling
        run: |
          npm install --global pnpm@11.9.0
          python -m pip install PyYAML==6.0.3 jsonschema==4.25.0
          pnpm --dir apps/web install --frozen-lockfile
      - name: Check source
        run: scripts/check.sh
      - name: Verify real Nginx request authority and origin
        run: python tests/nginx_proxy_smoke.py
      - name: Build source snapshot and dependency inventories
        run: |
          python scripts/package-release.py --output artifacts/hermes-prd-workbench-source.tar.gz
          python scripts/dependency-inventory.py --output artifacts/dependency-inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-evidence
          path: artifacts/
          retention-days: 7
